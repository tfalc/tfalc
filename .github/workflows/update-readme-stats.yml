name: Update README stats

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch full history so pushes/pulls work reliably
          fetch-depth: 0
          # use explicit PAT for push, do not persist the default GITHUB_TOKEN creds
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run generate_stats.py
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.STATS_PAT }}
          README_PATH: README.md
        run: |
          python scripts/generate_stats.py

      - name: Commit README changes if any
        env:
          # use PAT for push so commits are authored/committed by the user
          GIT_AUTH_TOKEN: ${{ secrets.STATS_PAT }}
        run: |
          git config --local user.name "Thiago Falcão da Silva"
          git config --local user.email "thiago.falcao86@gmail.com"
          git add README.md
          set -o pipefail
          # make sure local main is up-to-date before pushing
          git fetch origin main
          git pull --rebase origin main || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update README stats [skip ci]"
          # push using PAT so committer is your account
          git push "https://${GIT_AUTH_TOKEN}@github.com/${{ github.repository }}" HEAD:main
        shell: bash
